                  value:
                    error: "missing user id in context"
# --------------------------------------------------------------- 
  /api/v1/posts/{postID}/read:
    post:
      summary: Marks a specific post as read by the authenticated user.
      operationId: markPostRead
      tags:
        - Posts
      security:
        - bearerAuth: []
      parameters:
        - name: postID
          in: path
          required: true
          description: The UUID of the post to mark as read.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Returned when the post is successfully marked as read or was previously marked as read.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
              examples:
                markedForFirstTime:
                  summary: Post marked as read for the first time
                  value:
                    status: "post marked as read"
                alreadyMarked:
                  summary: Post was already marked as read
                  value:
                    status: "post already marked as read"
        '400':
          description: Returned when the postID URL parameter is not a valid UUID format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPostID:
                  summary: Invalid post ID format
                  value:
                    error: "invalid post id"
        '401':
          description: Returned when the access token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authTokenInvalid:
                  summary: Token missing or invalid
                  value:
                    error: "invalid access token"
        '404':
          description: Returned when the specified postID does not exist in the database.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                postNotFound:
                  summary: Post not found
                  value:
                    error: "post not found"
        '500':
          description: Returned when context lookup fails or a database error occurs while marking the post as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseFailure:
                  summary: Database error
                  value:
                    error: "failed to mark post read"
                missingContext:
                  summary: Missing user ID in context
                  value:
                    error: "missing user id in context"
# --------------------------------------------------------------- 
  /api/v1/posts/read:
    get:
      summary: Retrieves all posts that have been marked as read by the authenticated user.
      operationId: listReadPosts
      tags:
        - Posts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Returned with a JSON array of read posts. Returns an empty array if no posts have been marked as read.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReadPost'
              examples:
                readPostsList:
                  summary: One read post
                  value:
                    - id: "2b992f9d-5a7e-4008-8e69-0df854e7c7e1"
                      title: "Why Go instead of Python for backend systems"
                      url: "https://exampletech.com/posts/why-go/"
                      description: "A deep dive into concurrency, memory management, and typing in Go."
                      feed_id: "e4b01140-5b5c-4f9e-9764-77a83d7cb45d"
                      created_at: "2025-01-15T12:00:00Z"
                      updated_at: "2025-01-15T12:00:00Z"
                      published_at: "2025-01-15T10:00:00Z"
                      read_at: "2025-01-15T14:30:00Z"
                emptyList:
                  summary: No read posts
                  value: []
        '401':
          description: Returned when the access token is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                authTokenInvalid:
                  summary: Token missing or invalid
                  value:
                    error: "invalid access token"
        '500':
          description: Returned when context lookup fails or a database query error occurs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                databaseFailure:
                  summary: Database query failed
                  value:
                    error: "failed to get read posts for user"
                missingContext:
                  summary: Missing user ID in context
                  value:
                    error: "missing user id in context"


components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email

    Feed:
      type: object
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        category:
          type: string
        last_fetched_at:
          type: string
          format: date-time
          nullable: true
          description: Null if the feed has never been fetched.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - url
        - category
        - created_at
        - updated_at
        - last_fetched_at

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        url:
          type: string
          format: uri
        description:
          type: string
        feed_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        published_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - url
        - description
        - feed_id
        - created_at
        - updated_at
        - published_at

    ReadPost:
      allOf:
        - $ref: '#/components/schemas/Post'
        - type: object
          properties:
            read_at:
              type: string
              format: date-time
              description: Timestamp when the user marked this post as read.
          required:
            - read_at
        
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: User's display name (trimmed)
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          minLength: 20
          maxLength: 100
          description: Plaintext password
      required:
        - name
        - email
        - password

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 50
        password:
          type: string
          minLength: 20
          maxLength: 100
          description: Plaintext password
      required:
        - email
        - password


    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ValidationError:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    AuthResponse:
      allOf:
        - $ref: '#/components/schemas/User'  
        - $ref: '#/components/schemas/TokenPair'

    TokenPair:
      type: object                         
      properties:
        access_token:
          type: string
          description: JWT access token
        refresh_token:
          type: string
          description: Opaque refresh token
      required:
        - access_token
        - refresh_token 

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: New display name (trimmed)
        email:
          type: string
          format: email
          maxLength: 50
          description: New email address (must be unique)
        password:
          type: string
          minLength: 20
          maxLength: 100
          description: New plaintext password
      minProperties: 1
      
    UserUpdateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - updated_at

    CreateFeedRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: The RSS feed URL.
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: Custom name/label for the feed follow.
      required:
        - url
        - name

    FeedFollow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        feed_id:
          type: string
          format: uuid
        name:
          type: string
          description: The user's custom label for this feed.
        user_name:
          type: string
          description: The display name of the user who follows this feed.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - feed_id
        - name
        - user_name
        - created_at
        - updated_at
    
    FollowFeedRequest:
      type: object
      properties:
        feed_id:
          type: string
          format: uuid
          description: The UUID of the feed to follow.
        name:
          type: string
          minLength: 1
          maxLength: 45
          description: Custom label for the feed follow.
      required:
        - feed_id
        - name

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token for authenticated endpoints
    refreshTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Refresh token for /refresh and /logout

security: [] # public

     
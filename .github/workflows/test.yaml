name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feedsanctum_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'

      - name: Vet
        run: go vet ./...

      - name: Run tests
        env:
          TEST_DB_URL: postgres://postgres:postgres@localhost:5432/feedsanctum_test?sslmode=disable
          JWT_SECRET: ci-test-secret
        run: go test -p 1 ./...